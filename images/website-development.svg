<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Website development illustration</title>
  <desc id="desc">A modern browser interface with code, responsive layouts, and design tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09101f"/>
      <stop offset="0.55" stop-color="#10142b"/>
      <stop offset="1" stop-color="#071629"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f3cff"/>
      <stop offset="0.55" stop-color="#d82cbe"/>
      <stop offset="1" stop-color="#12c8ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="210" cy="140" r="130" fill="#7d35ff" opacity=".16" filter="url(#glow)"/>
  <circle cx="1020" cy="590" r="170" fill="#13c8ff" opacity=".12" filter="url(#glow)"/>
  <rect x="120" y="90" width="960" height="520" rx="34" fill="#0b0f1d" stroke="#5d4a8e" stroke-width="3"/>
  <rect x="120" y="90" width="960" height="76" rx="34" fill="#12162a"/>
  <circle cx="172" cy="128" r="11" fill="#ff4d8d"/><circle cx="207" cy="128" r="11" fill="#ffbe42"/><circle cx="242" cy="128" r="11" fill="#3ad98f"/>
  <rect x="305" y="111" width="520" height="34" rx="17" fill="#080b14" stroke="#2a3150"/>
  <rect x="860" y="111" width="150" height="34" rx="17" fill="url(#accent)" opacity=".8"/>
  <rect x="158" y="200" width="400" height="350" rx="24" fill="#0f1426" stroke="#292f50"/>
  <rect x="190" y="232" width="135" height="14" rx="7" fill="#8d56ff"/>
  <rect x="190" y="270" width="300" height="22" rx="11" fill="#f6f7ff" opacity=".95"/>
  <rect x="190" y="309" width="245" height="13" rx="6.5" fill="#8991aa"/>
  <rect x="190" y="337" width="275" height="13" rx="6.5" fill="#697188"/>
  <rect x="190" y="387" width="135" height="44" rx="12" fill="url(#accent)"/>
  <rect x="190" y="469" width="98" height="52" rx="10" fill="#191f37"/><rect x="305" y="469" width="98" height="52" rx="10" fill="#191f37"/><rect x="420" y="469" width="98" height="52" rx="10" fill="#191f37"/>
  <rect x="600" y="200" width="430" height="350" rx="24" fill="#0a0e1b" stroke="#292f50"/>
  <g font-family="monospace" font-size="24" fill="#d9ddff">
    <text x="638" y="255" fill="#ff66bc">&lt;section&gt;</text>
    <text x="674" y="300" fill="#7fdcff">&lt;h1&gt;</text><text x="765" y="300">Build better.</text><text x="938" y="300" fill="#7fdcff">&lt;/h1&gt;</text>
    <text x="674" y="345" fill="#7fdcff">&lt;p&gt;</text><text x="747" y="345">Responsive. Fast.</text>
    <text x="674" y="390" fill="#7fdcff">&lt;button&gt;</text><text x="810" y="390" fill="#ffcd6b">Launch</text><text x="900" y="390" fill="#7fdcff">&lt;/button&gt;</text>
    <text x="638" y="435" fill="#ff66bc">&lt;/section&gt;</text>
  </g>
  <path d="M710 505 C760 470 820 470 870 505 S980 540 1015 500" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <rect x="470" y="565" width="260" height="18" rx="9" fill="url(#accent)" opacity=".8"/>
